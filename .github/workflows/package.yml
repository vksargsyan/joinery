name: Package

# Installers for every platform (spec §20), each installed and smoke-tested where the runner
# allows, plus the SBOM and licence notices (spec §18). Pull requests and manual runs on a
# branch build test packages (electron-builder.adhoc.yml: unsigned, ad-hoc signed on macOS, no
# update feed). A v* tag builds the release: signed and notarised when the signing secrets exist
# (docs/releasing.md), with the update feed, and the release job puts everything in a draft
# GitHub release. Nothing is ever published from a pull request.
on:
  pull_request:
    paths:
      - .github/workflows/package.yml
      - apps/desktop/electron-builder*.yml
      - apps/desktop/package.json
      - apps/desktop/build/**
      - apps/desktop/scripts/**
      - apps/desktop/e2e/packaged.config.ts
      - apps/desktop/e2e/packaged/**
      - apps/desktop/src/main/updates.ts
      - apps/desktop/src/main/update-policy.ts
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rollout:
        description: 'Release runs (a v* tag picked above): share of installs offered the update, 0-100'
        type: number
        default: 100

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUERYBARA_E2E_OUTPUT: ${{ github.workspace }}/packaged-results
  # A pushed tag, or a manual run on a tag.
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # The staged rollout of a release (scripts/rollout.ts): the manual run's input, else the
  # repository variable, else everyone. format() keeps an input of 0 from reading as unset.
  ROLLOUT: >-
    ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.rollout)
    || vars.QUERYBARA_ROLLOUT_PERCENT || '100' }}

jobs:
  linux:
    name: Linux AppImage, deb, rpm (x64, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Ubuntu runners restrict the unprivileged user namespaces Chromium's sandbox needs; only
      # the smoke test's launcher honours this (e2e/packaged/launch.ts), never the app.
      QUERYBARA_E2E_NO_SANDBOX: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: querybara
          POSTGRES_PASSWORD: querybara
          POSTGRES_DB: querybara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U querybara" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # rpmbuild for the rpm target; electron-builder brings its own fpm and AppImage tools.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - run: pnpm --filter @querybara/desktop build
      - name: Package
        working-directory: apps/desktop
        run: |
          config=electron-builder.adhoc.yml
          if [ "$RELEASE" = true ]; then config=electron-builder.yml; fi
          pnpm exec electron-builder --config "$config" --linux AppImage deb rpm --x64 --arm64 \
            --publish never
          if [ "$RELEASE" = true ]; then pnpm run rollout "$ROLLOUT" dist; fi
      - name: SBOM and licence notices
        working-directory: apps/desktop
        run: |
          version="$(node -p "require('./package.json').version")"
          # The commit's time, so the same commit gives the same bill.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" pnpm run sbom --out "dist/querybara-$version.cdx.json"
          cp out/renderer/THIRD_PARTY_NOTICES.txt "dist/querybara-$version-THIRD_PARTY_NOTICES.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: querybara-linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest-linux*.yml
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: querybara-sbom
          path: |
            apps/desktop/dist/*.cdx.json
            apps/desktop/dist/*-THIRD_PARTY_NOTICES.txt
          retention-days: 14
          if-no-files-found: error
      - name: Install the deb and smoke test (PostgreSQL)
        working-directory: apps/desktop
        env:
          QUERYBARA_TEST_POSTGRES_URL: postgres://querybara:querybara@127.0.0.1:5432/querybara_test
          QUERYBARA_PACKAGED_APP: /opt/Querybara/querybara
        run: |
          sudo apt-get install -y ./dist/querybara_*_amd64.deb
          # A test build has no update feed; a release's deb updates itself.
          if [ "$RELEASE" = true ]; then
            export QUERYBARA_EXPECT_UPDATE_STATUS='checks for updates automatically'
            export QUERYBARA_E2E_UPDATE_CHECK=1
          else
            export QUERYBARA_EXPECT_UPDATE_STATUS='test build'
          fi
          xvfb-run -a pnpm exec playwright test -c e2e/packaged.config.ts
      - name: Smoke test the AppImage (updates turned off by policy)
        working-directory: apps/desktop
        env:
          QUERYBARA_TEST_POSTGRES_URL: postgres://querybara:querybara@127.0.0.1:5432/querybara_test
          # Runs without FUSE, which the runner lacks.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QUERYBARA_DISABLE_UPDATES: '1'
          QUERYBARA_EXPECT_UPDATE_STATUS: administrator
        run: |
          QUERYBARA_PACKAGED_APP="$(ls "$PWD"/dist/Querybara-*-x86_64.AppImage)"
          export QUERYBARA_PACKAGED_APP
          xvfb-run -a pnpm exec playwright test -c e2e/packaged.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-results-linux
          path: packaged-results
          retention-days: 7

  linux-arm64:
    name: Linux arm64 smoke test
    needs: linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      QUERYBARA_E2E_NO_SANDBOX: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: querybara
          POSTGRES_PASSWORD: querybara
          POSTGRES_DB: querybara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U querybara" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: querybara-linux
          path: apps/desktop/dist
      - name: Install the deb and smoke test (PostgreSQL)
        working-directory: apps/desktop
        env:
          QUERYBARA_TEST_POSTGRES_URL: postgres://querybara:querybara@127.0.0.1:5432/querybara_test
          QUERYBARA_PACKAGED_APP: /opt/Querybara/querybara
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          sudo apt-get install -y ./dist/querybara_*_arm64.deb
          file /opt/Querybara/querybara | grep -q aarch64
          xvfb-run -a pnpm exec playwright test -c e2e/packaged.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-results-linux-arm64
          path: packaged-results
          retention-days: 7

  windows:
    name: Windows NSIS, MSI, zip (x64, arm64)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # Code signing (docs/releasing.md): a certificate, or Azure Trusted Signing. Each is used
      # only in a release run and only when its secrets exist.
      WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE_PFX_BASE64 || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
      AZURE_TENANT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_SECRET || '' }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @querybara/desktop build
      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: |
          args=(--config electron-builder.adhoc.yml)
          if [ "$RELEASE" = true ]; then
            args=(--config electron-builder.yml)
            if [ -n "$WIN_CSC_LINK" ]; then
              echo "Signing with the code-signing certificate"
              args+=(-c.forceCodeSigning=true)
            elif [ -n "$AZURE_CLIENT_ID" ]; then
              echo "Signing with Azure Trusted Signing"
              args+=(-c.forceCodeSigning=true
                "-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
                "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
                "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
                "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER")
            else
              echo "::warning::No Windows signing secrets: the release is unsigned and will not update itself"
            fi
          fi
          pnpm exec electron-builder "${args[@]}" --win nsis msi zip --x64 --arm64 --publish never
          if [ "$RELEASE" = true ]; then pnpm run rollout "$ROLLOUT" dist; fi
      - uses: actions/upload-artifact@v7
        with:
          name: querybara-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest.yml
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      # The runner image has PostgreSQL installed as a disabled service (user postgres,
      # password root). Without it the smoke test takes its no-server path.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $service) { Write-Output '::warning::No PostgreSQL service: smoke tests without a server'; exit 0 }
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $bin = $env:PGBIN
          if (-not $bin) {
            $root = Get-ChildItem "$env:ProgramFiles\PostgreSQL" -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $bin = Join-Path $root.FullName 'bin'
          }
          $env:PGPASSWORD = 'root'
          & (Join-Path $bin 'createdb.exe') -h 127.0.0.1 -U postgres querybara_test
          if ($LASTEXITCODE -ne 0) { Write-Output '::warning::createdb failed: smoke tests without a server'; exit 0 }
          'QUERYBARA_TEST_POSTGRES_URL=postgres://postgres:root@127.0.0.1:5432/querybara_test' |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install with NSIS and smoke test
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'Querybara-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'querybara.exe' |
            Select-Object -First 1
          if (-not $exe) { throw 'The NSIS installer did not install querybara.exe' }
          $env:QUERYBARA_PACKAGED_APP = $exe.FullName
          # A test build has no feed; an unsigned release refuses to update without a publisher.
          $expect = 'not code-signed'
          if ($env:RELEASE -ne 'true') { $expect = 'test build' }
          elseif ($env:WIN_CSC_LINK -or $env:AZURE_CLIENT_ID) {
            $expect = 'checks for updates automatically'
            $env:QUERYBARA_E2E_UPDATE_CHECK = '1'
          }
          $env:QUERYBARA_EXPECT_UPDATE_STATUS = $expect
          pnpm exec playwright test -c e2e/packaged.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the MSI and check the Group Policy switch
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist -Filter 'Querybara-*-x64.msi' | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content $log -Tail 50; throw "msiexec exited $($install.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles\Querybara", "${env:ProgramFiles(x86)}\Querybara" -Recurse -Filter 'querybara.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw 'The MSI did not install querybara.exe' }
          # The machine-wide policy a Group Policy or Intune deployment sets.
          reg add 'HKLM\SOFTWARE\Policies\Querybara' /v DisableUpdates /t REG_DWORD /d 1 /f
          $env:QUERYBARA_PACKAGED_APP = $exe.FullName
          $env:QUERYBARA_EXPECT_UPDATE_STATUS = 'administrator'
          pnpm exec playwright test -c e2e/packaged.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-results-windows
          path: packaged-results
          retention-days: 7

  macos:
    name: macOS DMG and zip (universal)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Developer ID signing and notarisation (docs/releasing.md), in release runs only.
      CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
      CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
      APPLE_API_KEY_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_P8: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_P8 || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the macOS 26 icon
        # build/Assets.car is committed, but only actool from Xcode 26 or later compiles it, so a
        # catalog compiled on a Mac can lag behind build/icon.svg. Compiling it here keeps the
        # package's macOS 26 icon the current one (ADR 0033).
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_2[7-9]*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 or later on this runner, so Assets.car cannot be compiled"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          pnpm --filter @querybara/desktop icons | tee "$RUNNER_TEMP/icons.log"
          grep -q '^build/Assets.car  actool' "$RUNNER_TEMP/icons.log"
      - run: pnpm --filter @querybara/desktop build
      - name: Package
        id: package
        working-directory: apps/desktop
        env:
          # electron-builder skips signing in pull request builds unless told otherwise. The
          # ad-hoc signature needs no certificate or secret.
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          if [ "$RELEASE" = true ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "Signing with the Developer ID certificate and notarising"
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            export APPLE_API_KEY="$key"
            pnpm exec electron-builder --config electron-builder.yml -c.forceCodeSigning=true \
              --mac dmg zip --universal --publish never
            rm -f "$key"
            pnpm run rollout "$ROLLOUT" dist
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$RELEASE" = true ]; then
              echo "::warning::No Apple signing secrets: the macOS release is ad-hoc signed and will not update itself"
            fi
            unset CSC_LINK CSC_KEY_PASSWORD
            pnpm exec electron-builder --config electron-builder.adhoc.yml --mac dmg --universal \
              --publish never
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the signature and architectures
        working-directory: apps/desktop/dist/mac-universal
        env:
          SIGNED: ${{ steps.package.outputs.signed }}
        run: |
          codesign --verify --deep --strict --verbose=2 Querybara.app
          codesign --display --verbose=2 Querybara.app 2>&1 | grep -E '^(Identifier|Format|Signature|Authority|TeamIdentifier)'
          lipo -archs "Querybara.app/Contents/MacOS/$(defaults read "$PWD/Querybara.app/Contents/Info" CFBundleExecutable)"
          if [ "$SIGNED" = true ]; then
            xcrun stapler validate Querybara.app
            spctl --assess --type execute --verbose Querybara.app
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: querybara-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
          # DMGs and zips are already compressed.
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Start PostgreSQL
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install postgresql@16
          bin="$(brew --prefix postgresql@16)/bin"
          "$bin/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust >/dev/null
          "$bin/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -w start \
            -o "-p 5432 -k $RUNNER_TEMP -c listen_addresses=127.0.0.1"
          "$bin/createdb" -h 127.0.0.1 -U postgres querybara_test
      - name: Install from the DMG and smoke test
        working-directory: apps/desktop
        env:
          QUERYBARA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/querybara_test
          SIGNED: ${{ steps.package.outputs.signed }}
        run: |
          mountpoint="$(mktemp -d)"
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$mountpoint"
          app="$RUNNER_TEMP/Applications/Querybara.app"
          ditto "$mountpoint/Querybara.app" "$app"
          hdiutil detach "$mountpoint"
          QUERYBARA_PACKAGED_APP="$app/Contents/MacOS/$(defaults read "$app/Contents/Info" CFBundleExecutable)"
          export QUERYBARA_PACKAGED_APP
          if [ "$SIGNED" = true ]; then
            export QUERYBARA_EXPECT_UPDATE_STATUS='checks for updates automatically'
            export QUERYBARA_E2E_UPDATE_CHECK=1
          else
            export QUERYBARA_EXPECT_UPDATE_STATUS='test build'
          fi
          pnpm exec playwright test -c e2e/packaged.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-results-macos
          path: packaged-results
          retention-days: 7

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-arm64, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: querybara-*
          path: release
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match apps/desktop/package.json version $version"
            exit 1
          fi
          cd release
          # Checksums of what people download; the update metadata (*.yml) carries its own
          # SHA-512s and changes when a rollout does.
          shopt -s extglob
          sha256sum -- !(*.yml) > SHA256SUMS.txt
          ls -l
          flags=(--draft --verify-tag --title "Querybara $version" --generate-notes)
          # A pre-release version (1.2.0-beta.1) feeds the beta channel only.
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- *
          else
            gh release create "$TAG" "${flags[@]}" -- *
          fi
