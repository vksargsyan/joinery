# Packaging (spec §20). Configuration only: signing, notarisation and publishing belong to the
# release pipeline, which supplies certificates through the environment.
appId: dev.joinery.desktop
productName: Joinery
executableName: joinery
copyright: Copyright © 2026 Joinery
directories:
  output: dist
  buildResources: build

# electron-vite bundles every dependency into out/ (ADR 0004), so the package carries no
# node_modules and there is nothing native to rebuild.
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Electron fuses (spec §18), flipped in the packaged binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # The renderer is served from the app:// protocol, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: msi
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
msi:
  # For managed deployment (spec §20).
  perMachine: true

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal

linux:
  category: Development
  synopsis: Database manager for MySQL, MariaDB, PostgreSQL and more
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    # Flatpak (spec §20) uses electron-builder's `flatpak` target, which needs flatpak-builder
    # and the Freedesktop runtime on the build machine; add it once the release runners have them.

publish: null
