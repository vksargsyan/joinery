# Packaging (spec §20): release builds. Signing, notarisation and publishing credentials come
# from the environment of the Package workflow (docs/releasing.md); without them electron-builder
# builds unsigned. Test builds use electron-builder.adhoc.yml, which carries no update feed.
appId: dev.joinery.desktop
productName: Joinery
executableName: joinery
copyright: Copyright © 2026 Joinery
directories:
  output: dist
  buildResources: build

# electron-vite bundles every dependency into out/ (ADR 0004), so the package carries no
# node_modules and there is nothing native to rebuild.
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Electron fuses (spec §18), flipped in the packaged binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # The renderer is served from the app:// protocol, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false

# The update feed (spec §20): electron-builder writes it into resources/app-update.yml, which
# turns on electron-updater (src/main/updates.ts), and writes the update metadata next to the
# installers (latest.yml, latest-mac.yml, latest-linux.yml, latest-linux-arm64.yml; with the
# github provider a beta version gets latest*.yml too, and the channel comes from GitHub's
# pre-release flag). CI builds with --publish never; the release job uploads to a draft release.
publish:
  provider: github
  owner: vksargsyan
  repo: joinery
  releaseType: draft

# Icons are generated from build/icon.svg by scripts/icons.ts.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: msi
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  # One installer for both architectures; it installs the one the machine has.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
msi:
  # For managed deployment (spec §20). MSI installs are updated by redeploying, not by the app.
  artifactName: ${productName}-${version}-${arch}.${ext}
  perMachine: true

mac:
  # The bundle is Joinery.app: the top-level executableName (joinery, for Linux and Windows)
  # would otherwise name it, and the DMG's volume, in lower case.
  executableName: Joinery
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    # The zip is what Squirrel.Mac updates from; the DMG is for first installs.
    - target: dmg
      arch: universal
    - target: zip
      arch: universal

linux:
  icon: build/icons
  category: Development
  synopsis: Database manager for MySQL, MariaDB, PostgreSQL and more
  description: A database manager for MySQL, MariaDB, PostgreSQL, MongoDB and Redis.
  maintainer: Joinery <https://github.com/vksargsyan/joinery>
  # The .desktop file is named after package.json's desktopName, which Electron uses as the
  # window's app id, so docks match running windows to it.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    # No Flatpak: electron-builder's `flatpak` target only makes a single-file bundle that
    # nothing updates, on an end-of-life runtime unless pinned, and needs flatpak-builder and
    # about a gigabyte of runtimes on the runner. ADR 0013 records the Flathub route instead.
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
# The npm name is scoped (@joinery/desktop), which is no package or file name.
deb:
  packageName: joinery
  artifactName: joinery_${version}_${arch}.${ext}
rpm:
  packageName: joinery
  artifactName: joinery-${version}.${arch}.${ext}
