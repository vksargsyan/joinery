<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="title">
  <!--
    The Joinery icon, the one source every app icon is generated from (scripts/icons.ts): a
    database cylinder built from joined parts, three rust bands and a tall face locked under an
    ivory top, the joints drawing a J. Transparent around the artwork: Windows, Linux and the
    About dialog show it free-standing; macOS sets it on a Tenmoku tile.
  -->
  <title id="title">Joinery</title>
  <defs>
    <linearGradient id="body" x1="277" y1="401" x2="1002" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39281B"/>
      <stop offset=".32" stop-color="#17110C"/>
      <stop offset=".68" stop-color="#241B12"/>
      <stop offset="1" stop-color="#110D09"/>
    </linearGradient>
    <radialGradient id="bodyLight" cx="0" cy="0" r="1" gradientTransform="translate(839 690) rotate(90) scale(494 95)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65442C" stop-opacity=".3"/>
      <stop offset="1" stop-color="#65442C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="413" y1="133" x2="712" y2="412" gradientUnits="userSpaceOnUse">
